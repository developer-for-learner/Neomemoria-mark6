name: Validate improvements

on:
  push:
    branches:
      - agent/security-and-ux-improvements
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          test -d dist
          test -f dist/_worker.js
          test -f dist/static/app.js
          test -f dist/_headers
